<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SparkCharge</title>
  <meta name="description" content="Manage your SparkCharge account profile and settings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-auth-guard>

  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dashSidebar">
      <a class="dash-brand" href="index.html">
        <img src="images/image.png" alt="SparkCharge" height="24">
      </a>

      <nav class="dash-nav">
        <span class="dash-nav-label">Main</span>
        <a class="dash-link" href="dashboard.html">
          <i class="fas fa-gauge-high"></i> Dashboard
        </a>
        <a class="dash-link" href="charging.html">
          <i class="fas fa-bolt"></i> Charging Sessions
        </a>
        <span class="dash-nav-label">Account</span>
        <a class="dash-link" href="stations.html"><i class="fas fa-map-marker-alt"></i> Stations</a>
        <a class="dash-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
        <a class="dash-link active" id="navProfile" href="profile.html"><i class="fas fa-user"></i> Profile</a>
      </nav>

      <div class="dash-sidebar-cta">
        <h5><i class="fas fa-star" style="color:#ffc107;"></i> Go Pro</h5>
        <p>Unlock unlimited 350kW fast charging and priority access.</p>
        <a href="upgrade.html" class="btn-glow">Upgrade Plan</a>
      </div>
    </aside>

    <!-- Main -->
    <div class="dash-main">
      <header class="dash-topbar">
        <div class="dash-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations, sessions..." aria-label="Search">
        </div>
        <div class="dash-user">
          <div class="dash-user-info">
            <span class="u-name" id="userName">User</span>
            <span class="u-plan" id="userPlan">Plan</span>
          </div>
          <div class="dash-avatar" id="userAvatar">U</div>
          <button class="dash-logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </header>

      <main class="dash-content">
        <div class="dash-page-header">
          <h1>My <span class="gradient-text">Profile</span></h1>
          <p>Manage your account details, vehicle, and preferences.</p>
        </div>

        <!-- Profile account card -->
        <div class="dash-row two">
          <div class="dash-card">
            <div class="dash-card-header">
              <h3><i class="fas fa-id-badge"></i> Account Details</h3>
            </div>
            <form id="profileForm">
              <div class="form-field">
                <label for="profileName">Full Name</label>
                <div class="input-wrap">
                  <i class="fas fa-user"></i>
                  <input type="text" id="profileName" placeholder="Your full name" required>
                </div>
              </div>
              <div class="form-field">
                <label for="profileEmail">Email Address</label>
                <div class="input-wrap">
                  <i class="fas fa-envelope"></i>
                  <input type="email" id="profileEmail" placeholder="you@example.com" required>
                </div>
              </div>
              <div class="form-field">
                <label for="profilePhone">Phone Number</label>
                <div class="input-wrap">
                  <i class="fas fa-phone"></i>
                  <input type="tel" id="profilePhone" placeholder="+1 (555) 000-0000">
                </div>
              </div>
              <div class="form-field">
                <label for="profileVehicle">Vehicle Model</label>
                <div class="input-wrap">
                  <i class="fas fa-car"></i>
                  <input type="text" id="profileVehicle" placeholder="e.g. Tesla Model 3">
                </div>
              </div>
              <div class="form-field">
                <label for="profilePlan">Current Plan</label>
                <div class="input-wrap">
                  <i class="fas fa-bolt"></i>
                  <input type="text" id="profilePlan" readonly>
                </div>
              </div>
              <div class="form-field">
                <label for="profileSince">Member Since</label>
                <div class="input-wrap">
                  <i class="fas fa-calendar"></i>
                  <input type="text" id="profileSince" readonly>
                </div>
              </div>
              <button type="submit" class="btn-glow"><i class="fas fa-save"></i> Save Changes</button>
              <span class="auth-alert" id="profileAlert"></span>
            </form>
          </div>

          <!-- Security / password card -->
          <div class="dash-card">
            <div class="dash-card-header">
              <h3><i class="fas fa-shield-halved"></i> Security</h3>
            </div>
            <form id="passwordForm">
              <div class="form-field">
                <label for="currentPassword">Current Password</label>
                <div class="input-wrap">
                  <i class="fas fa-lock"></i>
                  <input type="password" id="currentPassword" placeholder="Enter current password">
                </div>
              </div>
              <div class="form-field">
                <label for="newPassword">New Password</label>
                <div class="input-wrap">
                  <i class="fas fa-lock"></i>
                  <input type="password" id="newPassword" placeholder="At least 6 characters">
                </div>
              </div>
              <div class="form-field">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-wrap">
                  <i class="fas fa-lock"></i>
                  <input type="password" id="confirmPassword" placeholder="Re-enter new password">
                </div>
              </div>
              <button type="submit" class="btn-glow"><i class="fas fa-key"></i> Update Password</button>
              <span class="auth-alert" id="passwordAlert"></span>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/error-boundary.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
