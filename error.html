<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | SparkCharge</title>
  <meta name="description" content="The page you are looking for could not be found.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="error-page">
    <div class="error-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>

    <div class="container">
      <div class="error-card text-center">
        <div class="error-code">4<span class="error-bolt"><i class="fas fa-bolt"></i></span>4</div>
        <h1 class="error-title">Oops! Page not found</h1>
        <p class="error-text">The page you're looking for doesn't exist, may have been moved, or the link you clicked is no longer available. Let's get you back on the road.</p>
        <a class="btn-glow" href="index.html" style="display:inline-flex;"><i class="fas fa-house"></i> Back to Home</a>
        <button type="button" class="btn-glow ghost" id="backBtn" style="display:inline-flex;"><i class="fas fa-arrow-left"></i> Go Back</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('backBtn').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else window.location.href = 'index.html';
    });
  </script>
</body>
</html>
