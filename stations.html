<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stations - SparkCharge</title>
  <meta name="description" content="Find and view SparkCharge charging stations near you, filter by charger type and availability.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/dropdown.css">
</head>
<body data-auth-guard>

  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dashSidebar">
      <div class="dash-sidebar-head">
        <a class="dash-brand" href="index.html">
          <img src="images/image.png" alt="SparkCharge" height="40">
        </a>
        <button class="dash-sidebar-close" id="dashSidebarClose" type="button" aria-label="Close menu">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <nav class="dash-nav">
        <span class="dash-nav-label">Main</span>
        <a class="dash-link" href="dashboard.html">
          <i class="fas fa-gauge-high"></i> Dashboard
        </a>
        <a class="dash-link" href="charging.html">
          <i class="fas fa-bolt"></i> Charging Sessions
        </a>
        <span class="dash-nav-label">Account</span>
        <a class="dash-link active" href="stations.html"><i class="fas fa-map-marker-alt"></i> Stations</a>
        <a class="dash-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
        <a class="dash-link" id="navProfile" href="profile.html"><i class="fas fa-user"></i> Profile</a>
      </nav>

      <div class="dash-sidebar-cta">
        <h5><i class="fas fa-star" style="color:#ffc107;"></i> Go Pro</h5>
        <p>Unlock unlimited 350kW fast charging and priority access.</p>
        <a href="upgrade.html" class="btn-glow">Upgrade Plan</a>
      </div>
    </aside>

    <!-- Main -->
    <div class="dash-main">
      <header class="dash-topbar">
        <button class="dash-menu-btn" id="dashMenuBtn" type="button" aria-label="Open menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="dash-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search stations..." id="stationSearch" aria-label="Search stations">
        </div>
        <div class="dash-user">
          <div class="dash-user-info">
            <span class="u-name" id="userName">User</span>
            <span class="u-mail" id="userMail">user@email.com</span>
            <span class="u-plan" id="userPlan">Plan</span>
          </div>
          <div class="dash-avatar" id="userAvatar">U</div>
          <button class="dash-logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </header>

      <main class="dash-content">
        <div class="dash-page-header">
          <h1>Charging <span class="gradient-text">Stations</span></h1>
          <p>Find a station near you and check real-time charger availability.</p>
        </div>

        <!-- Filters -->
        <div class="dash-filters">
          <button class="dash-filter active" data-type="all" type="button">All</button>
          <button class="dash-filter" data-type="350" type="button">Ultra Fast 350kW</button>
          <button class="dash-filter" data-type="150" type="button">Fast 150kW</button>
          <button class="dash-filter" data-type="50" type="button">Standard 50kW</button>
          <button class="dash-filter" data-type="available" type="button"><i class="fas fa-circle" style="color:var(--accent-green);"></i> Available</button>
          <div class="dash-filter">
            <i class="fas fa-sort"></i>
            <select id="sortFilter">
              <option value="default">Sort: Default</option>
              <option value="name">Sort: Name A-Z</option>
              <option value="distance">Sort: Distance</option>
            </select>
          </div>
        </div>

        <!-- Stations grid -->
        <div class="station-grid" id="stationGrid"></div>
        <p class="empty-state" id="stationsEmpty" style="display:none; text-align:center; color:var(--text-muted); padding:40px 0;">
          No stations match your filters.
        </p>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/error-boundary.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/stations.js"></script>
  <script src="js/dropdown.js"></script>
</body>
</html>
